[package]
name = "r-share"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
sentry = { version = "0.49.2", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "httpdate", "rustls"] }
sentry-anyhow = "0.49.2"
tempfile = "3"
prost = "0.13"
prost-types = "0.13"
ssh-key = { version = "0.6.7", features = ["ed25519"] }
zeroize = "1.9.0"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-lambda = "1.146.0"
aws-sdk-cloudwatchlogs = "1.155.0"
azure_identity = "1.0.0"
azure_core = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "cookies", "gzip", "brotli", "deflate"] }
cookie_store = "0.21"
url = "2"
http = "1"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"], optional = true }
regex = "1.13.1"
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
chrono = "0.4"

# azure_data_cosmos_driver only ships its native query-plan library for
# linux/macos/windows and doesn't compile for Android, so the `azure` module is
# unavailable there.
[target.'cfg(not(target_os = "android"))'.dependencies]
azure_data_cosmos = "0.38.0"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
cmake = "0.1"
bindgen = "0.72"

[features]
# Builds c-share's `http` module (additionally libcurl, on top of the
# wolfSSL every build already needs for `crypto`) in addition to `waker`
# and `crypto`, and exposes it as the `http` module. Off by default: a clean
# vcpkg cache compiles wolfSSL/curl from source, which is slow.
c_share_http = ["dep:tokio"]

[dev-dependencies]
async-trait = "0.1.92"
aws-sdk-lambda = { version = "1.146.0", features = ["test-util"] }
aws-sdk-cloudwatchlogs = { version = "1.155.0", features = ["test-util"] }
aws-smithy-mocks = "0.3.0"
flate2 = "1.1.10"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt"] }
